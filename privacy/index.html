
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy | FullDex</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
body{margin:0;background:#0d1017;color:white;font-family:Arial,sans-serif;line-height:1.8}
header,footer{padding:24px;border-bottom:1px solid #333}
main{max-width:850px;margin:50px auto;padding:24px}
p,li{color:#c1c7d2}
a{color:#8fb3ff}
</style>
</head>
<body>
<header><a href="/">FullDex</a></header>
<main id="policy">
<h1>Privacy Policy</h1>
<p>Loading privacy policy...</p>
</main>
<footer><a href="/">Home</a></footer>
<script>
fetch('https://raw.githubusercontent.com/mamesj/pokemon-fulldex/main/PRIVACY.md')
.then(r => {
  if (!r.ok) throw new Error('Unavailable');
  return r.text();
})
.then(md => {
  document.getElementById('policy').innerHTML =
    marked.parse(md);
})
.catch(() => {
  document.getElementById('policy').textContent =
    'Privacy policy temporarily unavailable.';
});
</script>
</body>
</html>
